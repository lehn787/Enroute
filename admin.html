<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnRoute Admin</title>
    <meta name="description" content="Admin dashboard for EnRoute.">
    <link rel="icon" type="image/png" href="img/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
    <div id="admin-auth-container" class="hidden" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-page); padding: 1rem;">
        <!-- Login/Signup injected here -->
    </div>

    <div id="admin-app" class="hidden admin-layout">
        
        <!-- Mobile Header (Visible only on <768px) -->
        <header class="mobile-header">
            <button id="mobile-menu-btn" class="hamburger-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
            <img src="img/logo.png" alt="EnRoute Logo" style="height: 24px; width: auto; display: block;">
            <h1 class="mobile-header-title">EnRoute Admin</h1>
        </div>
        </header>

        <!-- Mobile Drawer Overlay -->
        <div id="mobile-drawer-overlay" class="mobile-drawer-overlay"></div>
        
        <!-- Sidebar / Mobile Drawer -->
        <aside id="admin-sidebar" class="admin-sidebar">
            <div class="sidebar-header" style="padding: 1.5rem 1.75rem;">
                <div style="display: flex; align-items: flex-start; gap: 1rem;">
                    <img src="img/logo.png" alt="EnRoute Logo" style="height: 46px; width: auto; display: block; margin-top: 2px;">
                    <div style="display: flex; flex-direction: column; gap: 3px;">
                        <h1 style="font-size: 26px; font-weight: 800; color: var(--primary); margin: 0; line-height: 1; letter-spacing: -0.03em;">EnRoute</h1>
                        <span style="font-size: 12px; font-weight: 800; color: var(--primary-dark); text-transform: uppercase; letter-spacing: 0.08em; line-height: 1; margin-bottom: 2px;">ADMIN</span>
                        <p style="font-size: 14px; color: var(--text-muted); margin: 0; font-weight: 500;">Transit Management</p>
                    </div>
                </div>
                <button id="mobile-close-btn" class="close-drawer-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <nav class="sidebar-nav" style="display: flex; flex-direction: column; gap: 0.25rem;">
                <a href="#dashboard" class="admin-nav-link active" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                    Dashboard
                </a>
                <a href="#buses" class="admin-nav-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"></path><path d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"></path><path d="M8 19v2"></path><path d="M16 19v2"></path><path d="M4 11h16"></path><circle cx="8" cy="15" r="1"></circle><circle cx="16" cy="15" r="1"></circle></svg>
                    Buses
                </a>
                <a href="#stops" class="admin-nav-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    Stops
                </a>
                <a href="#routes" class="admin-nav-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg>
                    Routes
                </a>
                <a href="#timings" class="admin-nav-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Timings
                </a>
                
                <div class="sidebar-section-title" style="margin-top: 1rem; margin-bottom: 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; padding-left: 1rem;">Data Import</div>
                <a href="#import" class="admin-nav-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Import Timetable
                </a>
            </nav>
            <div class="sidebar-footer">
                <div id="admin-user-email" class="sidebar-email"></div>
                <button id="reset-db-btn" class="btn btn-outline-primary mb-2">Reset Database</button>
                <button id="logout-btn" class="btn btn-danger" style="width: 100%; padding: 0.75rem; border-radius: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div id="admin-main-content" class="admin-main-content">
                <!-- Dynamic admin content injected here -->
            </div>
            
            <!-- Editor Modal Container -->
            <div id="admin-modal-container" class="hidden modal-container"></div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- Application Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="js/config.js?v=14"></script>
    <script src="js/auth.js?v=14"></script>
    <script src="js/data.js?v=14"></script>
    <script src="js/store.js?v=14"></script>
    <script src="js/ocr.js?v=14"></script>
    <script src="js/parser.js?v=14"></script>
    <script src="js/import-ui.js?v=14"></script>
    <script src="js/admin.js?v=14"></script>
    <div id="toast-container"></div>
</body>

</html>
